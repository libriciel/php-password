include:
  - template: Security/Container-Scanning.gitlab-ci.yml

variables:
  CONTAINER_IMAGE: "${CI_REGISTRY_IMAGE}:${CI_COMMIT_REF_NAME}"

build:
  stage: build
  tags:
    - docker-build
  variables:
    GITHUB_API_TOKEN: "${GITHUB_API_TOKEN}"
  script:
    - docker login -u "gitlab-ci-token" -p "$CI_JOB_TOKEN" $CI_REGISTRY
    - docker build --build-arg GITHUB_API_TOKEN=$GITHUB_API_TOKEN --pull -t ${CONTAINER_IMAGE} .
    - docker login -u "gitlab-ci-token" -p "$CI_JOB_TOKEN" $CI_REGISTRY
    - docker push ${CONTAINER_IMAGE}


container_scanning:
  variables:
    CS_IMAGE: $CONTAINER_IMAGE


unit_test:
  stage: test
  image : "$CONTAINER_IMAGE"
  script:
    - cd /app/
    - php -dpcov.enabled=1 -dpcov.directory=. vendor/bin/phpunit --coverage-text --colors=never --coverage-clover coverage/coverage.xml --log-junit coverage/logfile.xml
    - cp -rf coverage $CI_PROJECT_DIR
  coverage: '/^\s*Lines:\s*\d+.\d+\%/'
  artifacts:
    paths:
      - coverage
    expire_in: 1h

php-cs-fixer:
  stage: test
  image: "$CONTAINER_IMAGE"
  variables:
    NO_DATABASE: true
  script:
    - cd /app/
    - ./vendor/bin/php-cs-fixer fix --dry-run --diff

quality:
  stage: test
  only:
    - master
  image : gitlab.libriciel.fr:4567/docker/sonar-scanner:latest@sha256:e12600bccae008ded01d637b600bb54f15dfdf45a35398d62afc60cd64cafc21
  script:
      - cp -rf $CI_PROJECT_DIR /app/
      - cd /app
      - /sonar-scanner -Dsonar.login=$SONAR_LOGIN -Dsonar.host.url=$SONAR_HOST_URL
