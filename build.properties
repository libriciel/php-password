project.name = cbuffin-php-password

dir.out = ${basedir}/out
dir.logs = ${basedir}/out/logs

# Binaires
pdepend = ${basedir}/vendor/bin/pdepend
phpcb = ${basedir}/vendor/bin/phpcb
phpcpd = ${basedir}/vendor/bin/phpcpd
phpcs = ${basedir}/vendor/bin/phpcs
phpdoc = ${basedir}/vendor/bin/phpdoc
phploc = ${basedir}/vendor/bin/phploc
phpmd = ${basedir}/vendor/bin/phpmd
phpunit = ${basedir}/vendor/bin/phpunit

ruleset.phpmd = ${basedir}/phpmd.dist.xml

excludes = **/out/**,**/vendor/**
css.includes = **/*.css
css.excludes = ${excludes}
php.includes = **/*.php
php.excludes = ${excludes}
xml.includes = **/*.xml,**/*.xsl
xml.excludes = ${excludes}
js.includes = **/*.js
js.excludes = ${excludes}
po.includes = **/*.po
po.excludes = ${excludes}
sh.includes = **/*.sh
sh.excludes = ${excludes}