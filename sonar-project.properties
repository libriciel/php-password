# Required metadata
sonar.projectKey=php-password
sonar.projectName=php-password
sonar.projectVersion=master

# Project paths
sonar.sources=.
sonar.projectBaseDir=.
sonar.exclusions=vendor/**,coverage/**

# Encoding of the source files
sonar.sourceEncoding=UTF-8

# Coverage files path
sonar.php.tests.reportPath=coverage/logfile.xml
sonar.php.coverage.reportPaths=coverage/coverage.xml
